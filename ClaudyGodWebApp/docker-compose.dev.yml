# docker-compose.dev.yml
services:
  # ── Next.js Development Server ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
    image: claudygod-web:dev
    container_name: claudygod_web_dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Exclude these from mounting (use container versions)
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      API_BASE_URL: ${API_BASE_URL:-https://api.claudygod.org}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      VALID_API_KEYS: ${VALID_API_KEYS:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Enable hot reload in Docker
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - cgm_dev_net

  # ── Nginx (Optional for dev, mimics production setup) ──────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: claudygod_nginx_dev
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - cgm_dev_net

networks:
  cgm_dev_net:
    driver: bridge
