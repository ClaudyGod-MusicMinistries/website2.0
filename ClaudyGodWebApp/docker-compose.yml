services:

  # ── Next.js Application ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://claudygod.org}
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
    image: claudygod-web:latest
    container_name: claudygod_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # lib/data/backendProxy.ts reads this exact name — it was never set here
      # before (only the unread NEXT_PUBLIC_API_URL build arg was), which made
      # every /api/* proxy call fail with a 502 against the unreachable
      # http://localhost:8080 fallback. webApi.claudygod.org is this site's
      # backend — api.claudygod.org is the separate mobile-app backend.
      API_BASE_URL: ${API_BASE_URL:-https://webApi.claudygod.org}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      VALID_API_KEYS: ${VALID_API_KEYS:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_live_placeholder}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-pk_live_placeholder}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://claudygod.org}
    env_file:
      - .env
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cgm_net

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: claudygod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # Mount TLS certs (Let's Encrypt / manual)
      - nginx_cache:/var/cache/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - cgm_net

networks:
  cgm_net:
    driver: bridge

volumes:
  nginx_cache:
