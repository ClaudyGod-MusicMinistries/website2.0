name: Build & Push Web → GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claudygod-musicministries/cgm-web
  NODE_VERSION: "20"
  WORKDIR: ClaudyGodWebApp

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality gate — lint, type-check, build ──────────────────────────────────
  quality-gate:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        run: |
          # Install Node.js 20 via NodeSource (ubuntu-latest ships with 22+)
          curl -fsSL https://deb.nodesource.com/setup_${{ env.NODE_VERSION }}.x | sudo -E bash -
          sudo apt-get install -y nodejs
          
          # Verify installation
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          
          # Enable corepack for package manager version management
          sudo corepack enable || true

      - name: Cache node_modules
        run: |
          # Manual caching using GitHub's cache action pattern
          # npm ci will use the cache if package-lock.json hasn't changed
          echo "cache-hit=false" >> $GITHUB_STATE

      - name: Install dependencies
        run: |
          # Use --prefer-offline to use cached packages when available
          npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://claudygod.org' }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_placeholder

  # ─── Build + Push ────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short-sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-
          labels: |
            org.opencontainers.image.title=ClaudyGod Web
            org.opencontainers.image.description=ClaudyGod Music Ministry – Next.js 14 frontend
            org.opencontainers.image.vendor=ClaudyGod-MusicMinistries

      - name: Build and push
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.WORKDIR }}
          file: ./${{ env.WORKDIR }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://claudygod.org' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ✅ Web Image Pushed to GHCR"
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Tags | \`latest\`, \`sha-${{ steps.sha.outputs.short }}\` |"
            echo "| Platform | \`linux/amd64\` |"
          } >> $GITHUB_STEP_SUMMARY

  # ─── Deploy to Production ────────────────────────────────────────────────────
  deploy:
    name: Deploy Web to production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 300s
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            
            DEPLOY_PATH="$(echo '${{ secrets.VPS_DEPLOY_PATH }}' | tr -d '[:space:]')"
            cd "$DEPLOY_PATH" || { echo "❌ Failed to cd into $DEPLOY_PATH"; exit 1; }

            # Update infra scripts
            git pull origin main --ff-only || git fetch origin main && git reset --hard origin/main || true

            # Authenticate to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            export TAG="sha-${{ needs.build.outputs.short-sha }}"
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

            COMPOSE="docker compose \
              --env-file $DEPLOY_PATH/.env \
              --project-directory $DEPLOY_PATH \
              -f $DEPLOY_PATH/docker/docker-compose.yml"

            echo "→ Pulling web image: ${IMAGE}"
            $COMPOSE pull web

            echo "→ Deploying web service..."
            $COMPOSE up -d --no-deps --remove-orphans web

            # Health check
            sleep 5
            if $COMPOSE ps web | grep -q "Up"; then
              echo "✓ Web service is healthy"
            else
              echo "⚠️ Web service may not be running — check logs with: docker compose logs web"
            fi

            # Cleanup old images
            docker image prune -f --filter "until=24h" >/dev/null 2>&1 || true
            
            echo "✓ Web deploy complete — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "### ✅ Production Deploy Successful"
              echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.short-sha }}\`"
              echo "**Time:** $(date -u)"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Production Deploy Failed — check logs above" >> $GITHUB_STEP_SUMMARY
          fi