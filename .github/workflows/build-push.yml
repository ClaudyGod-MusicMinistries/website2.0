name: Build & Push Web → GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claudygod-musicministries/cgm-web
  WORKDIR: ClaudyGodWebApp

# Prevent concurrent deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Quality gate — lint, type-check, build ──────────────────────────────────
  quality-gate:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    container: node:22.23.1-bookworm
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned job container replaces actions/setup-node, which is not
      # permitted by the organisation's GitHub Actions allowlist.
      - name: Verify runner Node.js runtime
        run: npm run verify:runtime

      - name: Install dependencies
        run: |
          # Use --prefer-offline to use cached packages when available
          npm ci --legacy-peer-deps --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run release quality gate
        run: npm run check
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://claudygod.org' }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_placeholder

  # ─── Build + Push ────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short-sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-
          labels: |
            org.opencontainers.image.title=ClaudyGod Web
            org.opencontainers.image.description=ClaudyGod Music Ministry – Next.js 16 frontend
            org.opencontainers.image.vendor=ClaudyGod-MusicMinistries

      - name: Build and push
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.WORKDIR }}
          file: ./${{ env.WORKDIR }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://claudygod.org' }}
            NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ✅ Web Image Pushed to GHCR"
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Tags | \`latest\`, \`sha-${{ steps.sha.outputs.short }}\` |"
            echo "| Platform | \`linux/amd64\` |"
          } >> $GITHUB_STEP_SUMMARY

  # ─── Hand off to the infrastructure repo ────────────────────────────────────
  # ClaudyGodweb-Infrastructure is the single source of truth for production —
  # it owns docker-compose.yml and the SSH deploy script. This repo used to SSH
  # into the VPS itself with a hardcoded compose service name ("web"), which
  # broke the instant that service was renamed to "claudygod-web" and would
  # have kept silently deleting the frontend container on every deploy
  # (--remove-orphans on a single-service `up`). Same class of bug as
  # CGM-Backend's old direct-SSH deploy job, fixed the same way: build here,
  # then dispatch to infra's already-existing repository_dispatch listener.
  deploy:
    name: Trigger deploy in ClaudyGodweb-Infrastructure
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Dispatch deploy-web
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "❌ GH_PAT secret is not set (needs repo scope on ClaudyGodweb-Infrastructure)."
            echo "Add it in GitHub → website2.0 → Settings → Secrets and variables → Actions"
            exit 1
          fi

          TAG="sha-${{ needs.build.outputs.short-sha }}"
          echo "→ Dispatching deploy-web (tag=$TAG) to ClaudyGodweb-Infrastructure..."

          http_code=$(curl -sS -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ClaudyGod-MusicMinistries/ClaudyGodweb-Infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-web\",\"client_payload\":{\"service\":\"web\",\"tag\":\"${TAG}\"}}")

          if [ "$http_code" != "204" ]; then
            echo "❌ Dispatch failed (HTTP $http_code):"
            cat /tmp/dispatch_response.json
            exit 1
          fi
          echo "✓ Deploy dispatched — infra repo will pull ${TAG} and restart claudygod-web"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            {
              echo "### ✅ Deploy Dispatched"
              echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.short-sha }}\`"
              echo "**Time:** $(date -u)"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Dispatch Failed — check logs above" >> $GITHUB_STEP_SUMMARY
          fi
