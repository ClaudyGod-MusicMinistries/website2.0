name: Frontend quality and API contract

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ClaudyGodWebApp/package-lock.json
      - name: Install exact dependencies
        working-directory: ClaudyGodWebApp
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Test
        working-directory: ClaudyGodWebApp
        run: npm test
      - name: Type-check
        working-directory: ClaudyGodWebApp
        run: npm run type-check
      - name: Production build
        working-directory: ClaudyGodWebApp
        run: npm run build

  production-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed backend contract
        working-directory: ClaudyGodWebApp
        env:
          API_BASE_URL: https://api.claudygod.org
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: node scripts/verify-backend-contract.mjs
