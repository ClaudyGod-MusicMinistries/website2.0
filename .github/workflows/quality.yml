name: Frontend quality and API contract

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container: node:22.23.1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Node.js runtime
        working-directory: ClaudyGodWebApp
        run: npm run verify:runtime
      - name: Install exact dependencies
        working-directory: ClaudyGodWebApp
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit production dependencies
        working-directory: ClaudyGodWebApp
        run: npm audit --omit=dev --audit-level=high
      - name: Run release quality gate
        working-directory: ClaudyGodWebApp
        env:
          NEXT_PUBLIC_SITE_URL: https://claudygod.org
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
        run: npm run check

  production-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: node:22.23.1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Node.js runtime
        working-directory: ClaudyGodWebApp
        run: npm run verify:runtime
      - name: Verify deployed backend contract
        working-directory: ClaudyGodWebApp
        env:
          API_BASE_URL: https://api.claudygod.org
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: npm run contract:backend
